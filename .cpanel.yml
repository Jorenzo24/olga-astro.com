---
# Déploiement cPanel (Git Version Control).
#
# NOTE: replace CPANELUSER below with the real cPanel username before the
# first cPanel "Git Version Control" deploy (see .claude/CLAUDE.md).
#
# On copie la racine en bloc plutôt qu'une liste de dossiers : la liste
# manuelle avait dérivé et le déploiement aurait livré un site sans /fr/ ni
# /ru/ et avec 9 dossiers renommés manquants. Le glob ./* ignore les fichiers
# cachés (.git, .claude, .env…), d'où la copie explicite du seul .htaccess.
#
# .env n'est JAMAIS déployé par Git : il est déposé une fois à la main dans
# $DEPLOYPATH et contient les identifiants SMTP (voir .env.example).
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/public_html/
    - /bin/cp -R ./* $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
